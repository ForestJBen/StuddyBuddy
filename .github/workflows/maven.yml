name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: studybuddy
        ports:
          - 3306:3306
        options: >- 
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: Application/studybuddy/studybuddy

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: Application/studybuddy/studybuddy/pom.xml

      - name: Build with Maven
        run: sh ./mvnw -B clean verify -e
        env:
          DB_URL: jdbc:mysql://localhost:3306/studybuddy
          DB_USERNAME: root
          DB_PASSWORD: root
